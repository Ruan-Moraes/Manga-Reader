        "410":
          "description": "Transporte de conteúdo retirado; rejeitado antes de ler o corpo"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
          "content":
            "application/problem+json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "required":
                  - "contractVersion"
                  - "code"
                  - "retryable"
                "properties":
                  "contractVersion":
                    "const": "2.0"
                  "code":
