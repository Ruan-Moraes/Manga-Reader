  "/internal/tasks/ocr":
    "post":
      "deprecated": true
      "summary": "Rota de conteúdo retirada"
      "security": []
      "responses":
        "410":
          "description": "Transporte de conteúdo retirado; rejeitado antes de ler o corpo"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
          "content":
            "application/problem+json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "required":
                  - "contractVersion"
                  - "code"
                  - "retryable"
                "properties":
                  "contractVersion":
                    "const": "2.0"
                  "code":
                    "const": "content-route-retired"
                  "retryable":
                    "const": false
components:
  responses:
    Unauthorized:
      description: Credencial ausente, inválida ou expirada
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/GatewayProblem"
    Forbidden:
      description: Instalação revogada ou job não pertence à instalação
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/GatewayProblem"
    RateLimited:
      description: Quota por instalação, global ou rate limit atingido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/GatewayProblem"
    ServiceUnavailable:
      description: Kill switch ativo, configuração inválida ou dependência indisponível
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/GatewayProblem"

  schemas:
    AnonymousInstallationCreated:
      type: object
      additionalProperties: false
      required: [contractVersion, installationRef, credential, createdAt]
      properties:
        contractVersion:
          type: string
          const: "1.0"
        installationRef:
          type: string
          format: uuid
        credential:
          type: string
          minLength: 32
          maxLength: 512
          readOnly: true
        createdAt:
          type: string
          format: date-time

    AnonymousSessionRequest:
      type: object
      additionalProperties: false
      required: [installationRef]
      properties:
        installationRef:
          type: string
          format: uuid

    AnonymousSessionCreated:
      type: object
      additionalProperties: false
      required: [contractVersion, accessToken, expiresAt]
      properties:
        contractVersion:
          type: string
          const: "1.0"
        accessToken:
          type: string
          minLength: 32
          maxLength: 4096
          readOnly: true
        expiresAt:
          type: string
          format: date-time

    GatewayErrorCode:
      type: string
      enum:
        - invalid-request
        - invalid-contract-version
        - consent-required
        - unsupported-pair
        - unsupported-media-type
        - payload-too-large
        - capabilities-unavailable
        - gateway-disabled
        - unauthorized
        - installation-revoked
        - quota-exceeded
        - job-not-found
        - job-state-conflict
        - cancellation-unavailable
        - storage-unavailable
        - dispatch-unavailable
        - ocr-invalid-media
        - ocr-invalid-response
        - ocr-unavailable
        - translation-invalid-request
        - translation-invalid-response
        - translation-unavailable
        - internal-error

    GatewayProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, contractVersion, correlationRef]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 160
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: "#/components/schemas/GatewayErrorCode"
        contractVersion:
          type: string
          const: "1.0"
        correlationRef:
          type: string
          format: uuid
        retryable:
          type: boolean
          default: false
