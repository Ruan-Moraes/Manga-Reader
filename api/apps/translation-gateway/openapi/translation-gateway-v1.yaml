openapi: 3.1.0
info:
  title: Toonlira — identidade anônima e retirada do transporte v1
  version: 1.1.0
  description: Identidade preservada; processamento atual no contrato v2.
paths:
  /v1/anonymous/installations:
    post:
      tags: [Anonymous identity]
      operationId: createAnonymousInstallation
      summary: Cria uma identidade anônima e entrega a credencial longa uma única vez
      security: []
      x-log-policy: metadata-only
      responses:
        "201":
          description: Instalação criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousInstallationCreated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/anonymous/sessions:
    post:
      tags: [Anonymous identity]
      operationId: createAnonymousSession
      summary: Troca a credencial longa por um bearer curto e revogável
      security:
        - installationCredential: []
      x-log-policy: never-log-authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymousSessionRequest"
      responses:
        "201":
          description: Sessão curta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousSessionCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  "/v1/capabilities":
    "get":
      "deprecated": true
      "summary": "Rota de conteúdo retirada"
      "security": []
      "responses":
        "410":
          "description": "Transporte de conteúdo retirado; rejeitado antes de ler o corpo"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
          "content":
            "application/problem+json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "required":
                  - "contractVersion"
                  - "code"
                  - "retryable"
                "properties":
                  "contractVersion":
                    "const": "2.0"
                  "code":
                    "const": "content-route-retired"
                  "retryable":
                    "const": false
  "/v1/page-jobs":
    "post":
      "deprecated": true
      "summary": "Rota de conteúdo retirada"
      "security": []
      "responses":
        "410":
          "description": "Transporte de conteúdo retirado; rejeitado antes de ler o corpo"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
          "content":
            "application/problem+json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "required":
                  - "contractVersion"
                  - "code"
                  - "retryable"
                "properties":
                  "contractVersion":
                    "const": "2.0"
                  "code":
                    "const": "content-route-retired"
                  "retryable":
                    "const": false
  "/v1/page-jobs/by-idempotency/{idempotencyKey}":
    "get":
      "deprecated": true
      "summary": "Rota de conteúdo retirada"
      "security": []
      "responses":
        "410":
          "description": "Transporte de conteúdo retirado; rejeitado antes de ler o corpo"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
          "content":
            "application/problem+json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "required":
                  - "contractVersion"
                  - "code"
                  - "retryable"
                "properties":
                  "contractVersion":
                    "const": "2.0"
                  "code":
                    "const": "content-route-retired"
                  "retryable":
                    "const": false
    "parameters":
      -
        "name": "idempotencyKey"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
  "/v1/page-jobs/{jobRef}":
    "get":
      "deprecated": true
      "summary": "Rota de conteúdo retirada"
      "security": []
      "responses":
        "410":
          "description": "Transporte de conteúdo retirado; rejeitado antes de ler o corpo"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
          "content":
            "application/problem+json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "required":
                  - "contractVersion"
                  - "code"
                  - "retryable"
                "properties":
                  "contractVersion":
                    "const": "2.0"
                  "code":
                    "const": "content-route-retired"
                  "retryable":
                    "const": false
    "parameters":
      -
        "name": "jobRef"
        "in": "path"
